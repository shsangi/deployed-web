<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Utility Bills Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --electric-bg: #fef3c7;
            --electric-text: #b45309;
            --gas-bg: #dcfce7;
            --gas-text: #15803d;
            --paid-bg: #d1fae5;
            --paid-text: #047857;
            --due-bg: #fee2e2;
            --due-text: #b91c1c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.4;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.75rem;
        }

        /* Header & Controls */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            width: 100%;
        }

        .controls {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            width: 100%;
        }

        select {
            padding: 0.5rem 1.5rem 0.5rem 0.5rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.8rem;
            outline: none;
            background: var(--card-bg);
            color: var(--text-main);
            flex: 1;
            min-width: 0;
            transition: border-color 0.2s;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 0.5rem top 50%;
            background-size: 0.55rem auto;
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }

        /* --- MODERN TABLE STYLES --- */
        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        /* --- DESKTOP VIEW --- */
        @media (min-width: 769px) {
            .container { padding: 2rem; }
            .controls { width: auto; flex-wrap: nowrap; }
            h1 { font-size: 1.5rem; margin-bottom: 1rem; }
            .controls select { flex: none; min-width: 120px; font-size: 0.9rem; }
            
            th, td {
                padding: 0.8rem 0.5rem;
                border-bottom: 1px solid var(--border);
                font-size: 0.85rem;
                white-space: nowrap;
            }

            th {
                background-color: #f8fafc;
                font-weight: 600;
                color: var(--text-muted);
            }

            #monthlyTable th, #monthlyTable td { text-align: right; }
            #monthlyTable th:nth-child(1), #monthlyTable td:nth-child(1),
            #monthlyTable th:nth-child(2), #monthlyTable td:nth-child(2),
            #monthlyTable th:nth-child(3), #monthlyTable td:nth-child(3),
            #monthlyTable th:nth-child(4), #monthlyTable td:nth-child(4) {
                text-align: left;
            }

            /* Interactive row hover for desktop */
            #monthlyTable tbody tr:not(.month-subtotal-row):not(.grand-total-row):hover {
                background-color: #f8fafc;
                cursor: pointer;
            }

            .month-subtotal-row { background-color: #f8fafc !important; font-weight: 700 !important; border-top: 2px solid var(--border) !important; }
            .grand-total-row { background-color: #e2e8f0 !important; font-weight: 700 !important; color: var(--text-main) !important; }
        }

        /* --- MOBILE VIEW (SINGLE ROW WITH CHIPS & HEADERS) --- */
        @media (max-width: 768px) {
            #monthlyTable { table-layout: fixed; }
            
            /* Column headers */
            #monthlyTable thead { display: table-header-group; }
            #monthlyTable th {
                padding: 0.4rem 0.1rem;
                font-size: 0.55rem;
                text-transform: uppercase;
                text-align: center;
                background: #f8fafc;
                color: var(--text-muted);
                border-bottom: 1px solid var(--border);
                white-space: normal;
                line-height: 1.1;
            }

            #monthlyTable td {
                padding: 0.5rem 0.1rem;
                border-bottom: 1px solid var(--border);
                font-size: 0.65rem;
                text-align: center;
                vertical-align: middle;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            /* Adjust column widths for the 9 columns to fit */
            #monthlyTable th:nth-child(1), #monthlyTable td:nth-child(1) { width: 5%; color: var(--text-muted); font-size: 0.6rem; }
            #monthlyTable th:nth-child(2), #monthlyTable td:nth-child(2) { width: 15%; font-weight: 700; color: var(--primary); }
            #monthlyTable th:nth-child(3), #monthlyTable td:nth-child(3) { width: 15%; font-size: 0.6rem; }
            #monthlyTable th:nth-child(4), #monthlyTable td:nth-child(4) { width: 10%; }
            #monthlyTable th:nth-child(5), #monthlyTable td:nth-child(5) { width: 13%; }
            #monthlyTable th:nth-child(6), #monthlyTable td:nth-child(6) { width: 7%; }
            #monthlyTable th:nth-child(7), #monthlyTable td:nth-child(7) { width: 13%; }
            #monthlyTable th:nth-child(8), #monthlyTable td:nth-child(8) { width: 11%; }
            #monthlyTable th:nth-child(9), #monthlyTable td:nth-child(9) { width: 11%; }

            /* CHIP STYLING FOR MOBILE VALUES */
            .mobile-chip {
                display: inline-block;
                padding: 0.15rem 0.2rem;
                border-radius: 3px;
                font-size: 0.6rem;
                font-weight: 700;
                max-width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
                vertical-align: middle;
            }

            .chip-due { background: var(--due-bg); color: var(--due-text); }
            .chip-amount { background: #e0e7ff; color: #3730a3; }
            .chip-arrears { background: #f3f4f6; color: #4b5563; }
            .chip-paid { background: var(--paid-bg); color: var(--paid-text); }
            .chip-electric { background: var(--electric-bg); color: var(--electric-text); font-size: 0.5rem; padding: 0.1rem 0.2rem; }
            .chip-gas { background: var(--gas-bg); color: var(--gas-text); font-size: 0.5rem; padding: 0.1rem 0.2rem; }
            .negative-arrears { color: #10b981 !important; background: #ecfdf5 !important; }

            /* Visual separator for new month groups instead of a huge header */
            tr.month-start-row td {
                border-top: 2px solid var(--primary) !important;
            }

            /* Subtotal Row */
            .month-subtotal-row { background: #e2e8f0 !important; font-weight: 700 !important; }
            .month-subtotal-row td { padding: 0.4rem 0.1rem; font-size: 0.65rem; }
            
            .month-subtotal-row td:nth-child(1) { visibility: hidden; }
            .month-subtotal-row td:nth-child(2) { text-align: left; padding-left: 0.3rem; }
            
            /* Grand Total Row */
            .grand-total-row { background: var(--text-main) !important; color: white !important; border-radius: 6px; margin-top: 1rem; }
            .grand-total-row td { padding: 0.5rem 0.1rem; font-size: 0.65rem; color: white !important; }
            
            .grand-total-row td:nth-child(1) { visibility: hidden; }
            .grand-total-row td:nth-child(2) { text-align: left; padding-left: 0.3rem; color: #cbd5e1 !important; }
        }

        /* Common Badges (Desktop) */
        .badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-electric { background-color: var(--electric-bg); color: var(--electric-text); }
        .badge-gas { background-color: var(--gas-bg); color: var(--gas-text); }

        /* Utilities */
        .status-msg { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.9rem; }
        .error { color: #ef4444; background: #fee2e2; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; display: none; font-size: 0.85rem; }

        /* --- MODAL / POPUP STYLES --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(2px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            position: relative;
            transform: translateY(20px);
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
        }
        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem;
            border-bottom: 1px solid var(--border);
            background: #f8fafc;
            border-radius: 16px 16px 0 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            line-height: 1;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.2rem;
        }
        .modal-close:hover { color: #ef4444; }
        
        .modal-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .detail-group {
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .detail-group-title {
            background: #f1f5f9;
            padding: 0.5rem 0.75rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.6rem 0.75rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: var(--text-muted); font-weight: 500; flex: 1; }
        .detail-value { font-weight: 600; text-align: right; word-break: break-word; flex: 1; }

        .json-modal-view {
            background: #0f172a;
            color: #e2e8f0;
            padding: 0.75rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75rem;
            white-space: pre-wrap;
            word-break: break-all;
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
        }
        .json-key { color: #93c5fd; }
        .json-string { color: #86efac; }
        .json-number { color: #fca5a5; }
        .json-boolean { color: #fcd34d; }
        .json-null { color: #f87171; }

        /* Styling for clickable rows indicator */
        @media (max-width: 768px) {
            #monthlyTable tbody tr:not(.month-subtotal-row):not(.grand-total-row):active {
                background-color: #e2e8f0;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Monthly Breakdown</h1>
        <div class="controls">
            <select id="filterMonth">
                <option value="all">Month</option>
            </select>
            <select id="filterYear">
                <option value="all">Year</option>
            </select>
            <select id="filterUtility">
                <option value="all">Utility</option>
                <option value="Electric">Electric</option>
                <option value="Gas">Gas</option>
            </select>
            <select id="filterHomeNo">
                <option value="all">Home No</option>
            </select>
        </div>
    </header>

    <div id="errorContainer" class="error"></div>

    <div class="table-container">
        <table id="monthlyTable">
            <thead>
                <tr>
                    <th>Sr</th>
                    <th>Home</th>
                    <th>Month</th>
                    <th>Type</th>
                    <th>Due</th>
                    <th>Units</th>
                    <th>Amount</th>
                    <th>Arrears</th>
                    <th>Paid</th>
                </tr>
            </thead>
            <tbody id="monthlyBody">
                <tr><td colspan="9" class="status-msg">Loading data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL POPUP -->
<div id="recordModal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">Bill Details</div>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody">
            <!-- Dynamically filled -->
        </div>
    </div>
</div>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTIaZO5G4scjILaELvE-NukUlA1OyyjTFCfwTVQONMBuHx2yJMe2YitJcvQgD9J-f7QtU6qwdyGL_sN/pub?output=csv';

    let allData = [];
    let processedData = []; 

    async function init() {
        try {
            const response = await fetch(CSV_URL);
            if (!response.ok) throw new Error('Failed to fetch CSV data');
            const csvText = await response.text();

            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allData = results.data;
                    processData();
                    setupFilters();
                    applyFilters(); // Initial Render
                },
                error: function(error) {
                    showError('Error parsing CSV: ' + error.message);
                }
            });
        } catch (error) {
            showError(error.message);
        }
    }

    function processData() {
        processedData = allData.map(row => {
            const monthYearStr = row['bill_month_year'] || '';
            let month = 'Unknown';
            let year = 'Unknown';
            let dateObj = new Date(0); 

            if (monthYearStr && monthYearStr.includes('-')) {
                const parts = monthYearStr.split('-');
                month = parts[0];
                year = parts[1];
                dateObj = new Date(`01-${month}-${year}`);
            }

            let lastPaidAmount = null;
            try {
                const historyStr = row['bill_payment_history_json'];
                if (historyStr) {
                    const historyObj = JSON.parse(historyStr);
                    if (Array.isArray(historyObj) && historyObj.length > 0) {
                        const latestRecord = historyObj[0];
                        lastPaidAmount = latestRecord.payment !== undefined ? latestRecord.payment : latestRecord.amount_paid;
                    }
                }
            } catch (e) {}

            return {
                ...row,
                _month: month,
                _year: year,
                _sortDate: dateObj,
                _lastPaidAmount: lastPaidAmount
            };
        });
    }

    function setupFilters() {
        const filterMonth = document.getElementById('filterMonth');
        const filterYear = document.getElementById('filterYear');
        const filterUtility = document.getElementById('filterUtility');
        const filterHomeNo = document.getElementById('filterHomeNo');

        const months = [...new Set(processedData.map(r => r._month))].filter(m => m !== 'Unknown');
        const years = [...new Set(processedData.map(r => r._year))].filter(y => y !== 'Unknown');
        const homes = [...new Set(processedData.map(r => r['home_number']))].filter(h => h);

        const monthOrder = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        months.sort((a, b) => monthOrder.indexOf(a) - monthOrder.indexOf(b));
        years.sort();
        homes.sort();

        months.forEach(m => { const opt = document.createElement('option'); opt.value = m; opt.textContent = m; filterMonth.appendChild(opt); });
        years.forEach(y => { const opt = document.createElement('option'); opt.value = y; opt.textContent = y; filterYear.appendChild(opt); });
        homes.forEach(h => { const opt = document.createElement('option'); opt.value = h; opt.textContent = h; filterHomeNo.appendChild(opt); });

        [filterMonth, filterYear, filterUtility, filterHomeNo].forEach(el => el.addEventListener('change', applyFilters));
    }

    function applyFilters() {
        const valMonth = document.getElementById('filterMonth').value;
        const valYear = document.getElementById('filterYear').value;
        const valUtility = document.getElementById('filterUtility').value;
        const valHome = document.getElementById('filterHomeNo').value;

        const filtered = processedData.filter(row => {
            if (valMonth !== 'all' && row._month !== valMonth) return false;
            if (valYear !== 'all' && row._year !== valYear) return false;
            if (valUtility !== 'all' && row['utility_type'] !== valUtility) return false;
            if (valHome !== 'all' && row['home_number'] !== valHome) return false;
            return true;
        });

        const groupedData = {};
        filtered.forEach(row => {
            const key = row['bill_month_year'];
            if (!groupedData[key]) groupedData[key] = { sortDate: row._sortDate, rows: [] };
            groupedData[key].rows.push(row);
        });

        const sortedKeys = Object.keys(groupedData).sort((a, b) => groupedData[a].sortDate - groupedData[b].sortDate);
        renderTable(sortedKeys, groupedData);
    }

    function renderTable(sortedKeys, groupedData) {
        const tbody = document.getElementById('monthlyBody');
        tbody.innerHTML = '';

        if (sortedKeys.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="status-msg">No records found.</td></tr>';
            return;
        }

        let grandTotalDue = 0, grandTotalAmount = 0, grandTotalArrears = 0, grandTotalPaid = 0;
        let globalRowCounter = 1;

        sortedKeys.forEach((key) => {
            const group = groupedData[key];
            const rows = group.rows;

            let monthTotalDue = 0, monthTotalAmount = 0, monthTotalArrears = 0, monthTotalPaid = 0;

            rows.forEach((row, rowIndex) => {
                const due = parseFloat(row['current_month_due']) || 0;
                const amount = parseFloat(row['current_month_amount']) || 0;
                const arrears = parseFloat(row['arrears_previous_dues']) || 0;
                const paid = parseFloat(row._lastPaidAmount) || 0;
                
                monthTotalDue += due;
                monthTotalAmount += amount;
                monthTotalArrears += arrears;
                monthTotalPaid += paid;

                const isElectric = String(row['utility_type']).toLowerCase() === 'electric';
                const badgeClass = isElectric ? 'badge-electric' : 'badge-gas';
                const chipUtilClass = isElectric ? 'chip-electric' : 'chip-gas';

                const tr = document.createElement('tr');
                if (rowIndex === 0) tr.className = 'month-start-row';
                
                // Save the row data securely in the DOM element for the click event
                tr.dataset.jsonRecord = JSON.stringify(row); 
                
                // Add click listener to open modal
                tr.addEventListener('click', () => openModal(row));

                tr.innerHTML = `
                    <td>${globalRowCounter++}</td>
                    <td>${row['home_number'] || '-'}</td>
                    <td>${row['bill_month_year']}</td>
                    <td><span class="badge ${badgeClass} ${chipUtilClass}" style="display:none;"></span><span class="mobile-chip ${chipUtilClass}">${isElectric ? 'E' : 'G'}</span></td>
                    <td><span class="mobile-chip chip-due">${due.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}</span></td>
                    <td>${row['current_month_units'] || '0'}</td>
                    <td><span class="mobile-chip chip-amount">${amount.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}</span></td>
                    <td><span class="mobile-chip ${arrears < 0 ? 'negative-arrears' : 'chip-arrears'}">${arrears.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}</span></td>
                    <td>${row._lastPaidAmount !== null && row._lastPaidAmount !== undefined ? `<span class="mobile-chip chip-paid">${paid.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}</span>` : '-'}</td>
                `;
                tbody.appendChild(tr);
            });

            const subtotalTr = document.createElement('tr');
            subtotalTr.className = 'month-subtotal-row';
            subtotalTr.innerHTML = `
                <td colspan="4" style="text-align: left;">Subtotal</td>
                <td>${monthTotalDue.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}</td>
                <td></td>
                <td>${monthTotalAmount.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}</td>
                <td>${monthTotalArrears.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}</td>
                <td>${monthTotalPaid.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}</td>
            `;
            tbody.appendChild(subtotalTr);

            grandTotalDue += monthTotalDue; grandTotalAmount += monthTotalAmount; grandTotalArrears += monthTotalArrears; grandTotalPaid += monthTotalPaid;
        });

        const grandTotalTr = document.createElement('tr');
        grandTotalTr.className = 'grand-total-row';
        grandTotalTr.innerHTML = `
            <td colspan="4" style="text-align: left;">GRAND TOTAL</td>
            <td>${grandTotalDue.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}</td>
            <td></td>
            <td>${grandTotalAmount.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}</td>
            <td>${grandTotalArrears.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}</td>
            <td>${grandTotalPaid.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})}</td>
        `;
        tbody.appendChild(grandTotalTr);
    }

    // --- MODAL LOGIC ---
    function openModal(rowData) {
        const modal = document.getElementById('recordModal');
        const title = document.getElementById('modalTitle');
        const body = document.getElementById('modalBody');

        title.textContent = `${rowData['home_number']} - ${rowData['utility_type']} (${rowData['bill_month_year']})`;
        body.innerHTML = '';

        // Split data into standard fields and JSON fields
        const standardFields = [];
        const jsonFields = [];

        for (const [key, value] of Object.entries(rowData)) {
            // Skip internal metadata used for sorting
            if (key.startsWith('_')) continue; 
            
            if (key.endsWith('_json') && value) {
                jsonFields.push({key, value});
            } else {
                standardFields.push({key, value});
            }
        }

        // Render Standard Fields
        if (standardFields.length > 0) {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'detail-group';
            groupDiv.innerHTML = `<div class="detail-group-title">Bill Information</div>`;
            
            standardFields.forEach(field => {
                const displayKey = field.key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                const displayVal = field.value !== null && field.value !== '' ? field.value : '-';
                
                const rowDiv = document.createElement('div');
                rowDiv.className = 'detail-row';
                rowDiv.innerHTML = `
                    <div class="detail-label">${displayKey}</div>
                    <div class="detail-value">${displayVal}</div>
                `;
                groupDiv.appendChild(rowDiv);
            });
            body.appendChild(groupDiv);
        }

        // Render JSON Fields
        jsonFields.forEach(field => {
            const displayKey = field.key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            const groupDiv = document.createElement('div');
            groupDiv.className = 'detail-group';
            
            try {
                const parsed = JSON.parse(field.value);
                groupDiv.innerHTML = `
                    <div class="detail-group-title">${displayKey}</div>
                    <div style="padding: 0.5rem;">
                        <div class="json-modal-view">${syntaxHighlight(parsed)}</div>
                    </div>
                `;
            } catch (e) {
                groupDiv.innerHTML = `
                    <div class="detail-group-title">${displayKey}</div>
                    <div class="detail-row"><div class="detail-value" style="color:red;">Invalid JSON String</div></div>
                `;
            }
            body.appendChild(groupDiv);
        });

        modal.classList.add('active');
        document.body.style.overflow = 'hidden'; // Prevent background scrolling
    }

    function closeModal(event) {
        // If event exists and target is not the overlay, do nothing (stops inner clicks from closing)
        if (event && event.target !== event.currentTarget) return;
        
        const modal = document.getElementById('recordModal');
        modal.classList.remove('active');
        document.body.style.overflow = ''; // Restore scrolling
    }

    // Handle Escape key to close modal
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeModal();
        }
    });

    function syntaxHighlight(json) {
        if (typeof json != 'string') json = JSON.stringify(json, undefined, 2);
        json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
            var cls = 'json-number';
            if (/^"/.test(match)) {
                if (/:$/.test(match)) cls = 'json-key';
                else cls = 'json-string';
            } else if (/true|false/.test(match)) cls = 'json-boolean';
            else if (/null/.test(match)) cls = 'json-null';
            return '<span class="' + cls + '">' + match + '</span>';
        });
    }

    function showError(msg) {
        const errDiv = document.getElementById('errorContainer');
        errDiv.textContent = msg; errDiv.style.display = 'block';
        document.getElementById('monthlyBody').innerHTML = '<tr><td colspan="9" class="status-msg" style="color:red;">Failed to load.</td></tr>';
    }

    document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
