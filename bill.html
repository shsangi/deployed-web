<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utility Bills Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --electric: #f59e0b;
            --gas: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Tab Navigation */
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }

        .tab-btn:hover { color: var(--primary); }
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* Header & Controls */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #0f172a;
        }

        .controls {
            display: flex;
            gap: 1rem;
        }

        input[type="text"], select {
            padding: 0.6rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            background: var(--card-bg);
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Table Styles */
        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            overflow-x: auto;
            border: 1px solid var(--border);
            max-height: 75vh;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
            font-size: 0.9rem;
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Summary Table Specifics */
        #monthlyTable th, #monthlyTable td {
            text-align: right;
        }
        #monthlyTable th:nth-child(1), #monthlyTable td:nth-child(1),
        #monthlyTable th:nth-child(2), #monthlyTable td:nth-child(2),
        #monthlyTable th:nth-child(3), #monthlyTable td:nth-child(3) {
            text-align: left;
        }

        .month-group-header {
            background-color: #e0e7ff;
            color: #3730a3;
            font-weight: bold;
            font-size: 1rem;
            text-align: left !important;
        }

        .month-subtotal-row {
            background-color: #f8fafc;
            font-weight: bold;
            color: #0f172a;
            border-bottom: 2px solid var(--primary);
        }

        .grand-total-row {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            font-size: 1.05rem;
        }

        /* Badge Styles */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .badge-electric { background-color: #fef3c7; color: #92400e; }
        .badge-gas { background-color: #d1fae5; color: #065f46; }

        /* JSON Viewer */
        .json-view {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.75rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            color: #334155;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 150px;
            overflow-y: auto;
            min-width: 200px;
        }

        .json-key { color: #0f172a; font-weight: bold; }
        .json-string { color: #059669; }
        .json-number { color: #2563eb; }
        .json-boolean { color: #d97706; }
        .json-null { color: #ef4444; }

        /* Utilities */
        .status-msg { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 1.1rem; }
        .error { color: #ef4444; background: #fee2e2; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; display: none; }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            header { flex-direction: column; align-items: flex-start; }
            .controls { width: 100%; flex-direction: column; }
            input[type="text"], select { width: 100%; }
            .tabs { flex-direction: column; gap: 0; }
            .tab-btn { text-align: left; padding: 1rem; border-bottom: 1px solid var(--border); border-left: 3px solid transparent; margin-bottom: 0; }
            .tab-btn.active { border-bottom-color: var(--border); border-left-color: var(--primary); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('detailed')">Detailed Data</button>
        <button class="tab-btn" onclick="switchTab('summary')">Monthly Summary</button>
    </div>

    <div id="errorContainer" class="error"></div>

    <!-- TAB 1: Detailed Data -->
    <div id="detailedTab" class="tab-content active">
        <header>
            <h1>All Bills Data</h1>
            <div class="controls">
                <input type="text" id="searchInput" placeholder="Search by Home No, Name, etc...">
                <select id="typeFilter">
                    <option value="all">All Utilities</option>
                    <option value="Electric">Electric Only</option>
                    <option value="Gas">Gas Only</option>
                </select>
            </div>
        </header>

        <div class="table-container">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody">
                    <tr><td colspan="100%" class="status-msg">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- TAB 2: Monthly Summary -->
    <div id="summaryTab" class="tab-content">
        <header>
            <h1>Monthly Breakdown</h1>
            <div class="controls">
                <select id="monthFilter">
                    <option value="all">All Months</option>
                    <!-- Populated dynamically -->
                </select>
            </div>
        </header>

        <div class="table-container">
            <table id="monthlyTable">
                <thead>
                    <tr>
                        <th>Home Number</th>
                        <th>Bill Month-Year</th>
                        <th>Utility</th>
                        <th>Current Due (Rs.)</th>
                        <th>Units</th>
                        <th>Current Amount (Rs.)</th>
                        <th>Arrears (Rs.)</th>
                    </tr>
                </thead>
                <tbody id="monthlyBody">
                    <tr><td colspan="7" class="status-msg">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTIaZO5G4scjILaELvE-NukUlA1OyyjTFCfwTVQONMBuHx2yJMe2YitJcvQgD9J-f7QtU6qwdyGL_sN/pub?output=csv';

    let allData = [];
    let headers = [];
    let aggregatedMonthlyData = {};

    async function init() {
        try {
            const response = await fetch(CSV_URL);
            if (!response.ok) throw new Error('Failed to fetch CSV data');
            const csvText = await response.text();

            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allData = results.data;
                    headers = results.meta.fields;
                    
                    renderHeaders();
                    renderDetailedTable(allData);
                    buildMonthlySummary();
                    
                    setupDetailedEvents();
                },
                error: function(error) {
                    showError('Error parsing CSV: ' + error.message);
                }
            });
        } catch (error) {
            showError(error.message);
        }
    }

    // --- TAB NAVIGATION LOGIC ---
    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        if(tabName === 'detailed') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('detailedTab').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('summaryTab').classList.add('active');
        }
    }

    // --- TAB 1: DETAILED DATA LOGIC ---
    function renderHeaders() {
        const thead = document.getElementById('tableHead');
        thead.innerHTML = '';
        
        const tr = document.createElement('tr');
        headers.forEach(header => {
            const th = document.createElement('th');
            const displayHeader = header.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            th.textContent = displayHeader;
            tr.appendChild(th);
        });
        thead.appendChild(tr);
    }

    function renderDetailedTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="100%" class="status-msg">No records found.</td></tr>';
            return;
        }

        data.forEach(row => {
            const tr = document.createElement('tr');
            headers.forEach(header => {
                const td = document.createElement('td');
                let value = row[header];

                if (header === 'utility_type') {
                    const badgeClass = String(value).toLowerCase() === 'electric' ? 'badge-electric' : 'badge-gas';
                    td.innerHTML = `<span class="badge ${badgeClass}">${value}</span>`;
                } 
                else if (header.endsWith('_json') && value) {
                    try {
                        const jsonObj = JSON.parse(value);
                        td.innerHTML = `<div class="json-view">${syntaxHighlight(jsonObj)}</div>`;
                    } catch (e) {
                        td.innerHTML = `<div class="json-view" style="color:red;">Invalid JSON</div>`;
                    }
                } 
                else {
                    td.textContent = value !== null && value !== undefined ? value : '';
                }
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    }

    function setupDetailedEvents() {
        const searchInput = document.getElementById('searchInput');
        const typeFilter = document.getElementById('typeFilter');

        const filterDetailedData = () => {
            const query = searchInput.value.toLowerCase();
            const type = typeFilter.value;

            const filtered = allData.filter(row => {
                const matchesType = type === 'all' || row['utility_type'] === type;
                const matchesQuery = Object.values(row).some(val => 
                    String(val).toLowerCase().includes(query)
                );
                return matchesType && matchesQuery;
            });
            renderDetailedTable(filtered);
        };

        searchInput.addEventListener('input', filterDetailedData);
        typeFilter.addEventListener('change', filterDetailedData);
    }

    // --- TAB 2: MONTHLY SUMMARY LOGIC ---
    function buildMonthlySummary() {
        aggregatedMonthlyData = {};
        
        // 1. Group by Month-Year
        allData.forEach(row => {
            const monthYear = row['bill_month_year'];
            if (!monthYear) return;

            if (!aggregatedMonthlyData[monthYear]) {
                aggregatedMonthlyData[monthYear] = [];
            }
            aggregatedMonthlyData[monthYear].push(row);
        });

        // 2. Sort Months Chronologically
        const sortedMonths = Object.keys(aggregatedMonthlyData).sort((a, b) => {
            // e.g., "Oct-2026"
            const dateA = new Date("01-" + a.replace('-', '-'));
            const dateB = new Date("01-" + b.replace('-', '-'));
            return dateA - dateB;
        });

        // 3. Populate Dropdown
        const monthFilter = document.getElementById('monthFilter');
        monthFilter.innerHTML = '<option value="all">All Months</option>';
        sortedMonths.forEach(month => {
            const option = document.createElement('option');
            option.value = month;
            option.textContent = month;
            monthFilter.appendChild(option);
        });

        // 4. Render Function
        const renderMonthlyTable = (monthsToRender) => {
            const tbody = document.getElementById('monthlyBody');
            tbody.innerHTML = '';

            if (monthsToRender.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="status-msg">No data found.</td></tr>';
                return;
            }

            let grandTotalDue = 0;
            let grandTotalAmount = 0;
            let grandTotalArrears = 0;

            monthsToRender.forEach(month => {
                const rows = aggregatedMonthlyData[month];
                
                // Month Header Row
                const headerTr = document.createElement('tr');
                headerTr.innerHTML = `<td colspan="7" class="month-group-header">${month}</td>`;
                tbody.appendChild(headerTr);

                let monthTotalDue = 0;
                let monthTotalAmount = 0;
                let monthTotalArrears = 0;

                // Render each row
                rows.forEach(row => {
                    const due = parseFloat(row['current_month_due']) || 0;
                    const amount = parseFloat(row['current_month_amount']) || 0;
                    const arrears = parseFloat(row['arrears_previous_dues']) || 0;
                    
                    monthTotalDue += due;
                    monthTotalAmount += amount;
                    monthTotalArrears += arrears;

                    const badgeClass = String(row['utility_type']).toLowerCase() === 'electric' ? 'badge-electric' : 'badge-gas';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row['home_number'] || '-'}</td>
                        <td>${row['bill_month_year']}</td>
                        <td><span class="badge ${badgeClass}">${row['utility_type'] || '-'}</span></td>
                        <td>${due.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                        <td>${row['current_month_units'] || '0'}</td>
                        <td>${amount.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                        <td style="color: ${arrears < 0 ? 'green' : 'inherit'}">${arrears.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                    `;
                    tbody.appendChild(tr);
                });

                // Month Subtotal Row
                const subtotalTr = document.createElement('tr');
                subtotalTr.className = 'month-subtotal-row';
                subtotalTr.innerHTML = `
                    <td colspan="3" style="text-align: left;">Subtotal for ${month}</td>
                    <td>${monthTotalDue.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                    <td></td>
                    <td>${monthTotalAmount.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                    <td>${monthTotalArrears.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                `;
                tbody.appendChild(subtotalTr);

                // Add to Grand Totals
                grandTotalDue += monthTotalDue;
                grandTotalAmount += monthTotalAmount;
                grandTotalArrears += monthTotalArrears;
            });

            // Grand Total Row
            const grandTotalTr = document.createElement('tr');
            grandTotalTr.className = 'grand-total-row';
            grandTotalTr.innerHTML = `
                <td colspan="3" style="text-align: left;">GRAND TOTAL</td>
                <td>${grandTotalDue.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                <td></td>
                <td>${grandTotalAmount.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                <td>${grandTotalArrears.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
            `;
            tbody.appendChild(grandTotalTr);
        };

        // Initial Render
        renderMonthlyTable(sortedMonths);

        // Filter Event
        monthFilter.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'all') {
                renderMonthlyTable(sortedMonths);
            } else {
                renderMonthlyTable([val]);
            }
        });
    }

    // --- UTILITIES ---
    function syntaxHighlight(json) {
        if (typeof json != 'string') {
             json = JSON.stringify(json, undefined, 2);
        }
        json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
            var cls = 'json-number';
            if (/^"/.test(match)) {
                if (/:$/.test(match)) {
                    cls = 'json-key';
                } else {
                    cls = 'json-string';
                }
            } else if (/true|false/.test(match)) {
                cls = 'json-boolean';
            } else if (/null/.test(match)) {
                cls = 'json-null';
            }
            return '<span class="' + cls + '">' + match + '</span>';
        });
    }

    function showError(msg) {
        const errDiv = document.getElementById('errorContainer');
        errDiv.textContent = msg;
        errDiv.style.display = 'block';
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="100%" class="status-msg" style="color:red;">Failed to load data.</td></tr>';
        document.getElementById('monthlyBody').innerHTML = '<tr><td colspan="7" class="status-msg" style="color:red;">Failed to load data.</td></tr>';
    }

    document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
